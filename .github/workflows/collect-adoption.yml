name: Collect adoption stats

on:
  schedule:
    - cron: "40 23 * * *"   # after repo-stats (23:00 UTC) refreshes traffic-data
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "site/**", ".github/workflows/collect-adoption.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-adoption
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m collector.run
        continue-on-error: true
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/dashboard.json data/last_run.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Fail if the collector failed
        if: steps.collect.outcome == 'failure'
        run: |
          cat data/last_run.json
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
